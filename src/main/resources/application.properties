spring.application.name=api

# Mapeamento dinâmico da porta do Render (10000)
server.port=${PORT:8080}

# Conexão Supabase - Porta 6543 (Transaction Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.hdvcaemirowgyobkhmfn.supabase.co:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Posoperatorio2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Adiamento da verificação de metadata JDBC
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

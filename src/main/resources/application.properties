spring.application.name=api

# Configuração de porta dinâmica do Render
server.port=${PORT:8080}

# --- Conexao Neon PostgreSQL ---
# O Spring tentará ler a DATABASE_URL do Render. Caso não exista, tentará a SPRING_DATASOURCE_URL.
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Dialeto PostgreSQL (Resolve o erro "Unable to determine Dialect") ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Hikari CP - Estabilidade e timeouts otimizados para o Render Free Tier ---
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=15000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000

# --- JPA / Hibernate - Criar/Atualizar tabelas automaticamente no Neon ---
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa o OSIV para liberar conexoes no pooler
spring.jpa.open-in-view=false

# --- LOGS TEMPORARIOS PARA DIAGNOSTICO ---
logging.level.org.postgresql=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate=INFO
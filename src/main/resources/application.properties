spring.application.name=api

# Configuração de porta dinâmica do Render
server.port=${PORT:8080}

# Conexao Transaction Pooler IPv4 (Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.hdvcaemirowgyobkhmfn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari CP - Estabilidade e timeouts otimizados para o Render Free Tier
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=15000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate - Mapeamento automatico camelCase -> snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Desativa o OSIV para liberar conexoes no pooler
spring.jpa.open-in-view=false